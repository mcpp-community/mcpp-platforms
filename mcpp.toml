[package]
namespace   = "mcpp"
name        = "platforms"
version     = "0.2.1"
description = "Rows for systems the engine does not carry: their definitions, bases and runners"
license     = "Apache-2.0"
repo        = "https://github.com/mcpp-community/mcpp-platforms"
# The rows' systems are read from `[[platform.system]]` and the runner tables are
# written over several lines (TOML 1.1): both are mcpp 2026.11.17.1.
mcpp        = ">=2026.11.17.1"

# The rows of this package (mcpp SPEC-013, SPEC-016). Each system states its
# name and what `uname -s` answers there, a row per architecture, and a
# provider per row: the base it links against (a sysroot package of xim) and,
# where an image of the system exists, the runner that boots it. A runner
# fetches a machine image on its first use, so it is off until a project or a
# machine enables it (`[target.<row>] runner = { enabled = true }`).

[platform]
targets   = ["x86_64-freebsd", "aarch64-freebsd", "x86_64-netbsd", "aarch64-netbsd", "x86_64-openbsd", "aarch64-openbsd",
             "x86_64-hurd", "x86_64-haiku"]
toolchain = "llvm@23.1.3"

[platform.link]
driver = "compiler"

# NetBSD's C++ layer is libc++, built from source over the system's C library
# (the providers' `layers`): the base's own C++ library, GCC's libstdc++, ships
# no module sources, so `import std` needs the other. libc++abi unwinds
# through the base's compiler runtime, libgcc_s, which clang's NetBSD driver
# does not name; a program that throws nothing does not need it.
[platform.build.'cfg(os = "netbsd")']
ldflags = ["-Wl,--as-needed", "-lgcc_s", "-Wl,--no-as-needed"]

# The compiler's run-time is not built for the Hurd: its rows link the base's
# libgcc, as the system's own programs do.
[platform.build.'cfg(os = "hurd")']
ldflags = ["-rtlib=libgcc", "--unwindlib=libgcc"]

# ── FreeBSD ─────────────────────────────────────────────────────────────────
# The rows are mcpp's own (its built-in table defines `<arch>-freebsd`); the
# table names no provider for them, so the system's base and runner are here.

[[platform.provider]]
serves  = ["x86_64-freebsd"]
sysroot = "xim:x86_64-freebsd-sysroot@14.5"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:freebsd-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.6.0", "xim:freebsd-disk-image@14.5-1", "xim:qemu-x86@9.2.4-1"], enabled = false }

[[platform.provider]]
serves  = ["aarch64-freebsd"]
sysroot = "xim:aarch64-freebsd-sysroot@14.5"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:aarch64-freebsd-disk-image}/dirun.toml", "--var", "firmware={pkg:ovmf}/share/edk2/edk2-aarch64-code.fd",
                   "--emulator", "{pkg:qemu-system}/bin/qemu-system-aarch64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.6.0", "xim:aarch64-freebsd-disk-image@14.5-1", "xim:ovmf@9.2.4-4", "xim:qemu-system@9.2.4"], enabled = false }

# ── NetBSD ──────────────────────────────────────────────────────────────────

[[platform.system]]
name  = "netbsd"
uname = "NetBSD"

[[platform.define]]
triple        = "x86_64-netbsd"
clang-triple  = "x86_64-unknown-netbsd10.2"
loader        = "/libexec/ld.elf_so"
object-format = "elf"
family        = "unix"
execution     = "netbsd"
tier          = "preview"
standard      = true

[[platform.define]]
triple        = "aarch64-netbsd"
clang-triple  = "aarch64-unknown-netbsd10.2"
loader        = "/libexec/ld.elf_so"
object-format = "elf"
family        = "unix"
execution     = "netbsd"
tier          = "preview"
standard      = true

[[platform.provider]]
serves  = ["x86_64-netbsd"]
sysroot = "xim:x86_64-netbsd-sysroot@10.2"
layers  = { "c++-abi" = "llvm.libcxx@22.1.8.3" }
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:netbsd-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.6.0", "xim:netbsd-disk-image@10.2-1", "xim:qemu-x86@9.2.4-1"], enabled = false }

[[platform.provider]]
serves  = ["aarch64-netbsd"]
sysroot = "xim:aarch64-netbsd-sysroot@10.2"
layers  = { "c++-abi" = "llvm.libcxx@22.1.8.3" }
hosted  = true
# NetBSD 10.2's arm64 live image, booted once (xim's aarch64-netbsd-disk-image), in QEMU's
# `virt' machine with the EDK II firmware for AArch64, translated on an x86_64 host.
runner  = { cmd = ["dirun", "--profile", "{pkg:aarch64-netbsd-disk-image}/dirun.toml", "--var", "firmware={pkg:ovmf}/share/edk2/edk2-aarch64-code.fd",
                   "--emulator", "{pkg:qemu-system}/bin/qemu-system-aarch64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.8.0", "xim:aarch64-netbsd-disk-image@10.2", "xim:ovmf@9.2.4-4", "xim:qemu-system@9.2.4"], enabled = false }

# ── OpenBSD ─────────────────────────────────────────────────────────────────
# OpenBSD 7.4 and later accept system calls only from libc (pinsyscalls): a
# program links the system's libc dynamically, which these rows do.

[[platform.system]]
name  = "openbsd"
uname = "OpenBSD"

[[platform.define]]
triple        = "x86_64-openbsd"
clang-triple  = "x86_64-unknown-openbsd8.0"
loader        = "/usr/libexec/ld.so"
object-format = "elf"
family        = "unix"
execution     = "openbsd"
tier          = "preview"
standard      = true

[[platform.define]]
triple        = "aarch64-openbsd"
clang-triple  = "aarch64-unknown-openbsd8.0"
loader        = "/usr/libexec/ld.so"
object-format = "elf"
family        = "unix"
execution     = "openbsd"
tier          = "preview"
standard      = true

[[platform.provider]]
serves  = ["x86_64-openbsd"]
sysroot = "xim:x86_64-openbsd-sysroot@8.0"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:openbsd-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.6.0", "xim:openbsd-disk-image@8.0-1", "xim:qemu-x86@9.2.4-1"], enabled = false }

[[platform.provider]]
serves  = ["aarch64-openbsd"]
sysroot = "xim:aarch64-openbsd-sysroot@8.0"
hosted  = true
# OpenBSD 8.0 for arm64 installed from the release's media (xim's aarch64-openbsd-disk-image),
# in QEMU's `virt' machine with the EDK II firmware for AArch64 and a Cortex-A72.
runner  = { cmd = ["dirun", "--profile", "{pkg:aarch64-openbsd-disk-image}/dirun.toml", "--var", "firmware={pkg:ovmf}/share/edk2/edk2-aarch64-code.fd",
                   "--emulator", "{pkg:qemu-system}/bin/qemu-system-aarch64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.8.0", "xim:aarch64-openbsd-disk-image@8.0", "xim:ovmf@9.2.4-4", "xim:qemu-system@9.2.4"], enabled = false }

# ── GNU/Hurd ────────────────────────────────────────────────────────────────
# Debian GNU/Hurd's amd64 port: glibc on the Hurd, with GCC's run-time and
# libstdc++, whose std module sources the base states (xim's
# x86_64-hurd-sysroot@20260314: the package versions of the image of the same
# day, so a program is built against the libraries it runs with), run in
# Debian's pre-installed image (xim's hurd-disk-image), whose disks are behind
# the machine's IDE controller and whose files disk is a tar archive (dirun
# 0.7.0).

[[platform.system]]
name  = "hurd"
uname = "GNU"

[[platform.define]]
triple        = "x86_64-hurd"
clang-triple  = "x86_64-pc-hurd-gnu"
loader        = "/lib/ld-x86-64.so.1"
object-format = "elf"
family        = "unix"
execution     = "hurd"
tier          = "preview"
standard      = true

[[platform.provider]]
serves  = ["x86_64-hurd"]
sysroot = "xim:x86_64-hurd-sysroot@20260314"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:hurd-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.7.0", "xim:hurd-disk-image@20260314", "xim:qemu-x86@9.2.4-1"], enabled = false }

# ── Haiku ───────────────────────────────────────────────────────────────────
# Haiku's x86_64 nightly: libroot with GCC's run-time and libstdc++ from
# HaikuPorts, whose std module sources the base states (xim's
# x86_64-haiku-sysroot hrev60431, revision 1; laid out as a running system,
# boot/system), run in an image of the same revision (xim's haiku-disk-image).

[[platform.system]]
name  = "haiku"
uname = "Haiku"

[[platform.define]]
triple        = "x86_64-haiku"
clang-triple  = "x86_64-unknown-haiku"
object-format = "elf"
family        = "unix"
execution     = "haiku"
tier          = "preview"
standard      = true

[[platform.provider]]
serves  = ["x86_64-haiku"]
sysroot = "xim:x86_64-haiku-sysroot@hrev60431"
hosted  = true
runner  = { cmd = ["dirun", "--profile", "{pkg:haiku-disk-image}/dirun.toml", "--emulator", "{pkg:qemu-x86}/bin/qemu-system-x86_64", "--", "{}"],
            host = "any", hosts = ["linux-x86_64"],
            requires = ["xim:dirun@0.7.0", "xim:haiku-disk-image@hrev60431", "xim:qemu-x86@9.2.4-1"], enabled = false }
