# The check of every row (.github/workflows/ci.yml): a C++ program with the std
# module, an exception and its arguments, built for the row and, where the row
# has a runner, run there; its status is 7.
[package]
name    = "hello"
version = "0.1.0"

# Every row of this repository's platform, from the working copy rather than
# the package index, with its runner enabled where it has one. Before the
# platform defines a row, `cfg(os = ...)` is answered by the triple as written
# (mcpp SPEC-013 §3.1).
[target.'cfg(any(os = "freebsd", os = "netbsd", os = "openbsd"))']
platform = { path = "../.." }
runner   = { enabled = true }
